stages:
  - test
  - build
  - deploy-preview
  - deploy-gitops
  - stop-preview

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  GATEWAY_IP: "129.80.246.47"
  GITOPS_REPO: "https://oauth2:${GITOPS_TOKEN}@gitlab.com/oci-project/oci-gitops.git"
  PREVIEW_MANIFESTS: "preview/ckad-app"

# --- 1. TESTES E QUALIDADE ---
lint-and-test:
  stage: test
  image: python:3.11-alpine
  script:
    - 'echo "Preparando ambiente de testes..."'
    - 'pip install --no-cache-dir -r requirements.txt pytest'
    - 'echo "Rodando testes unitarios com Pytest..."'
    - 'pytest test_app.py -v'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

ai-code-review:
  stage: test
  image: python:3.11-alpine
  before_script:
    - apk add --no-cache git
    - pip install google-genai
  script:
    - echo "Extraindo alteracoes do commit atual..."
    - git diff HEAD~1 HEAD > changes.diff || echo "" > changes.diff
    - echo "Iniciando Code Review com IA..."
    - python ai_reviewer.py changes.diff
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# --- 2. BUILD E SEGURANCA ---
build-and-push:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Buildando imagem $IMAGE_NAME..."
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

trivy-image-scan:
  stage: build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build-and-push"]
  script:
    - echo "Iniciando scan de vulnerabilidades na imagem..."
    - trivy image --exit-code 1 --severity CRITICAL,HIGH $IMAGE_NAME
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# --- 3. AMBIENTES EFEMEROS (MERGE REQUESTS) ---
deploy-preview:
  stage: deploy-preview
  image: alpine/k8s:1.31.13
  needs: ["build-and-push"]
  variables:
    NAMESPACE: "ckad-app-pr-${CI_MERGE_REQUEST_IID}"
  before_script:
    - apk add --no-cache git
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
  script:
    - |
      if [ -z "$KUBECONFIG_CONTENT" ]; then
        echo "Erro: defina KUBECONFIG_CONTENT (kubeconfig em base64) no GitLab CI/CD."
        exit 1
      fi
    - |
      if [ -z "$GITOPS_TOKEN" ]; then
        echo "Erro: defina GITOPS_TOKEN com permissao de read no repo gitops."
        exit 1
      fi
    - GATEWAY_IP_DASHED=$(echo "$GATEWAY_IP" | tr '.' '-')
    - export NAMESPACE="$NAMESPACE"
    - export PREVIEW_HOST="pr-${CI_MERGE_REQUEST_IID}.${GATEWAY_IP_DASHED}.nip.io"
    - |
      export ENVOY_NODEPORT=$(kubectl get svc -n envoy-gateway-system \
        -l gateway.envoyproxy.io/owning-gateway-name=public-gateway \
        -o jsonpath='{.items[0].spec.ports[?(@.port==80)].nodePort}')
      if [ -z "$ENVOY_NODEPORT" ]; then
        echo "Erro: NodePort do Envoy Gateway nao encontrada."
        kubectl get svc -n envoy-gateway-system
        exit 1
      fi
      echo "Envoy Gateway NodePort: ${ENVOY_NODEPORT}"
    - export PREVIEW_URL="http://${PREVIEW_HOST}:${ENVOY_NODEPORT}"
    - echo "PREVIEW_URL=${PREVIEW_URL}" >> deploy.env
    - echo "=========================================="
    - echo " Preview MR !${CI_MERGE_REQUEST_IID}"
    - echo " URL ${PREVIEW_URL}"
    - echo "=========================================="
    - echo "Clonando manifests de preview do GitOps..."
    - git clone --depth 1 "$GITOPS_REPO" oci-gitops
    - echo "Criando namespace ${NAMESPACE}..."
    - |
      sed -e "s/\${NAMESPACE}/$NAMESPACE/g" \
        oci-gitops/${PREVIEW_MANIFESTS}/01-namespace.yaml | kubectl apply -f -
    - echo "Configurando pull secret do GitLab Registry..."
    - |
      kubectl create secret docker-registry gitlab-registry \
        --docker-server="$CI_REGISTRY" \
        --docker-username="$CI_REGISTRY_USER" \
        --docker-password="$CI_REGISTRY_PASSWORD" \
        --namespace="$NAMESPACE" \
        --dry-run=client -o yaml | kubectl apply -f -
    - echo "Aplicando manifests de preview a partir do GitOps..."
    - |
      for manifest in oci-gitops/${PREVIEW_MANIFESTS}/0[2-9]-*.yaml; do
        sed \
          -e "s/\${NAMESPACE}/$NAMESPACE/g" \
          -e "s/\${PREVIEW_HOST}/$PREVIEW_HOST/g" \
          -e "s|\${IMAGE_NAME}|$IMAGE_NAME|g" \
          -e "s/\${MR_IID}/$CI_MERGE_REQUEST_IID/g" \
          "$manifest" | kubectl apply -f -
      done
    - kubectl rollout status deployment/ckad-app -n "$NAMESPACE" --timeout=120s
    - echo "Aguardando HTTPRoute ser aceito pelo Gateway..."
    - |
      for i in $(seq 1 30); do
        accepted=$(kubectl get httproute ckad-app-preview -n "$NAMESPACE" \
          -o jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}' 2>/dev/null || true)
        if [ "$accepted" = "True" ]; then
          echo "HTTPRoute aceito pelo Gateway."
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "Erro: HTTPRoute nao foi aceito a tempo."
          kubectl describe httproute ckad-app-preview -n "$NAMESPACE"
          exit 1
        fi
        sleep 2
      done
    - echo "Validando rota HTTP via Gateway (in-cluster)..."
    - |
      CHECK_POD="preview-check-${CI_JOB_ID}"
      kubectl delete pod "$CHECK_POD" -n "$NAMESPACE" --ignore-not-found --wait=false 2>/dev/null || true
      kubectl run "$CHECK_POD" -n "$NAMESPACE" --restart=Never --image=curlimages/curl --command -- \
        sh -c 'curl -sf --max-time 10 -H "Host: '"${PREVIEW_HOST}"'" http://'"${GATEWAY_IP}"'/'

      for i in $(seq 1 30); do
        phase=$(kubectl get pod "$CHECK_POD" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
        if [ "$phase" = "Succeeded" ]; then
          kubectl logs "$CHECK_POD" -n "$NAMESPACE"
          echo "Preview respondendo com sucesso."
          kubectl delete pod "$CHECK_POD" -n "$NAMESPACE" --ignore-not-found --wait=false
          break
        fi
        if [ "$phase" = "Failed" ]; then
          echo "Erro: curl in-cluster falhou."
          kubectl logs "$CHECK_POD" -n "$NAMESPACE" 2>/dev/null || true
          kubectl describe pod "$CHECK_POD" -n "$NAMESPACE"
          kubectl get httproute,deploy,svc,pods -n "$NAMESPACE"
          kubectl delete pod "$CHECK_POD" -n "$NAMESPACE" --ignore-not-found --wait=false
          exit 1
        fi
        if [ "$i" -eq 30 ]; then
          echo "Erro: preview nao respondeu apos 60s."
          kubectl logs "$CHECK_POD" -n "$NAMESPACE" 2>/dev/null || true
          kubectl describe pod "$CHECK_POD" -n "$NAMESPACE" 2>/dev/null || true
          kubectl get httproute,deploy,svc,pods -n "$NAMESPACE"
          kubectl delete pod "$CHECK_POD" -n "$NAMESPACE" --ignore-not-found --wait=false
          exit 1
        fi
        echo "Aguardando preview... tentativa ${i}/30"
        sleep 2
      done
    - echo "Preview disponivel em ${PREVIEW_URL}"
  artifacts:
    reports:
      dotenv: deploy.env
  environment:
    name: preview/mr-${CI_MERGE_REQUEST_IID}
    url: $PREVIEW_URL
    on_stop: stop-preview
    auto_stop_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stop-preview:
  stage: stop-preview
  image: alpine/k8s:1.31.13
  variables:
    NAMESPACE: "ckad-app-pr-${CI_MERGE_REQUEST_IID}"
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
  script:
    - echo "Destruindo ambiente efemero ${NAMESPACE}..."
    - kubectl delete namespace "$NAMESPACE" --wait=false
  environment:
    name: preview/mr-${CI_MERGE_REQUEST_IID}
    action: stop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

# --- 4. DEPLOY PRODUCAO (GITOPS/MASTER) ---
update-gitops-repo:
  stage: deploy-gitops
  image: alpine:latest
  before_script:
    - 'apk add --no-cache git'
    - 'git config --global user.email "ci-bot@seudominio.com"'
    - 'git config --global user.name "GitLab CI Bot"'
  script:
    - 'git clone https://oauth2:${GITOPS_TOKEN}@gitlab.com/oci-project/oci-gitops.git'
    - 'cd oci-gitops'
    - 'echo "Atualizando tag para $IMAGE_TAG no ambiente..."'
    - 'sed -i "s/tag:.*/tag: $IMAGE_TAG/g" apps/ckad-app-values.yaml'
    - 'git add apps/ckad-app-values.yaml'
    - 'git commit -m "chore(deploy): update ckad-app image to $IMAGE_TAG [skip ci]"'
    - 'git push origin master'
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
